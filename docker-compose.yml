# Requiere Docker Compose v2.20+ (usa `condition: service_completed_successfully`).
# Verificar con: docker compose version

services:
  # Genera la jerarquía de PKI una sola vez y termina. Los demás servicios
  # esperan a que este container termine exitosamente antes de arrancar.
  ca-setup:
    build: ./ca
    environment:
      - CERTS_OUT=/certs
    volumes:
      - ./certs:/certs

  coordinador-nacional:
    build: ./nodes
    environment:
      - ORG_NAME=coordinador-nacional
      - PORT=3000
      - PEERS=http://coordinador-provincial:3000,http://hospital-donante:3000,http://hospital-receptor:3000
      - CERTS_DIR=/certs
      - LEDGER_DATA_DIR=/data
      - INTERNAL_TOKEN=integra-secure-token-2024-fc17d9e8b2c4a6f1
      - IS_ORDERER=true
    volumes:
      - ./certs:/certs:ro
      - ./data/coordinador-nacional:/data
    ports:
      - "3001:3000"
    depends_on:
      ca-setup:
        condition: service_completed_successfully

  coordinador-provincial:
    build: ./nodes
    environment:
      - ORG_NAME=coordinador-provincial
      - PORT=3000
      - PEERS=http://coordinador-nacional:3000,http://hospital-donante:3000,http://hospital-receptor:3000
      - CERTS_DIR=/certs
      - LEDGER_DATA_DIR=/data
      - INTERNAL_TOKEN=integra-secure-token-2024-fc17d9e8b2c4a6f1
    volumes:
      - ./certs:/certs:ro
      - ./data/coordinador-provincial:/data
    ports:
      - "3002:3000"
    depends_on:
      ca-setup:
        condition: service_completed_successfully

  hospital-donante:
    build: ./nodes
    environment:
      - ORG_NAME=hospital-donante
      - PORT=3000
      - PEERS=http://coordinador-nacional:3000,http://coordinador-provincial:3000,http://hospital-receptor:3000
      - CERTS_DIR=/certs
      - LEDGER_DATA_DIR=/data
      - INTERNAL_TOKEN=integra-secure-token-2024-fc17d9e8b2c4a6f1
    volumes:
      - ./certs:/certs:ro
      - ./data/hospital-donante:/data
    ports:
      - "3003:3000"
    depends_on:
      ca-setup:
        condition: service_completed_successfully

  hospital-receptor:
    build: ./nodes
    environment:
      - ORG_NAME=hospital-receptor
      - PORT=3000
      - PEERS=http://coordinador-nacional:3000,http://coordinador-provincial:3000,http://hospital-donante:3000
      - CERTS_DIR=/certs
      - LEDGER_DATA_DIR=/data
      - INTERNAL_TOKEN=integra-secure-token-2024-fc17d9e8b2c4a6f1
    volumes:
      - ./certs:/certs:ro
      - ./data/hospital-receptor:/data
    ports:
      - "3004:3000"
    depends_on:
      ca-setup:
        condition: service_completed_successfully

  # No arranca con `docker compose up`. La telemetría es trazabilidad del
  # órgano: solo después de un assignment. Activar:
  #   ORGAN_ID=demo-donor-001 docker compose --profile iot up -d iot-simulator
  # Cadencia real del sensor: 5 s. 80 lecturas (~6 min 40 s de viaje).
  # INTERVALO_MS comprime el envío (no se espera el reloj del viaje).
  iot-simulator:
    build: ./iot-simulator
    profiles: ["iot"]
    environment:
      - DEVICE_ID=sensor-contenedor-001
      - CERTS_DIR=/certs
      - CUSTODY_NODE_URL=http://hospital-donante:3000
      - INTERVALO_MS=80
      - ORGANO=rinon
      - SIMULAR_FALLA_TEMP=true
      - CADENCIA_REAL_MS=5000
      - VIAJE_MS=400000
      - LECTURAS_MAX=80
      - ORGAN_ID=${ORGAN_ID:-demo-donor-001}
      - HEALTH_PORT=3010
    ports:
      - "3010:3010"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      - hospital-donante

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - INTEGRA_REPO_ROOT=/integralab
      - INTEGRA_NODES_HOST_MODE=compose
      - CERTS_DIR=/certs
      - ML_VIABILIDAD_API_URL=http://host.docker.internal:8001
    volumes:
      - .:/integralab:ro
      - ./certs:/certs:ro
    depends_on:
      - coordinador-nacional
      - coordinador-provincial
      - hospital-donante
      - hospital-receptor
